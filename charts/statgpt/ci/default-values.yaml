chat-backend:
  enabled: true
  fullnameOverride: "statgpt-chat-backend"
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "0.5Gi"
  env:
    DIAL_URL: &DIAL_URL "http://dial-core"
    PGVECTOR_HOST: &PGVECTOR_HOST "statgpt-pgvector"
    PGVECTOR_PORT: &PGVECTOR_PORT "5432"
    PGVECTOR_DATABASE: &PGVECTOR_DATABASE "statgpt"
    ELASTIC_CONNECTION_STRING: &ELASTIC_CONNECTION_STRING "http://statgpt-elasticsearch:9200"
    ELASTIC_INDICATORS_INDEX: &ELASTIC_INDICATORS_INDEX "statgpt-test-indicators"
    ELASTIC_MATCHING_INDEX: &ELASTIC_MATCHING_INDEX "statgpt-test-matching"
    MCP_APP_ORIGIN: &MCP_APP_URL "http://statgpt-mcp-app-frontend"
    MCP_APP_HTML_HOST: *MCP_APP_URL
  secrets:
    DIAL_API_KEY: &DIAL_API_KEY "DIAL_API_KEY"
    PGVECTOR_USER: &PGVECTOR_USER "statgpt"
    PGVECTOR_PASSWORD: &PGVECTOR_PASSWORD "password"
    ELASTIC_AUTH_USER: &ELASTIC_AUTH_USER "elastic"
    ELASTIC_AUTH_PASSWORD: &ELASTIC_AUTH_PASSWORD "password"

admin-backend:
  enabled: true
  fullnameOverride: "statgpt-admin-backend"
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "0.5Gi"
  env:
    OIDC_AUTH_ENABLED: "false"
    ADMIN_SCOPE_CLAIM_VALIDATION_ENABLED: "false"
    DIAL_URL: *DIAL_URL
    PGVECTOR_HOST: *PGVECTOR_HOST
    PGVECTOR_PORT: *PGVECTOR_PORT
    PGVECTOR_DATABASE: *PGVECTOR_DATABASE
    ELASTIC_CONNECTION_STRING: *ELASTIC_CONNECTION_STRING
    ELASTIC_INDICATORS_INDEX: *ELASTIC_INDICATORS_INDEX
    ELASTIC_MATCHING_INDEX: *ELASTIC_MATCHING_INDEX
    MCP_APP_ORIGIN: *MCP_APP_URL
    MCP_APP_HTML_HOST: *MCP_APP_URL
  secrets:
    DIAL_API_KEY: *DIAL_API_KEY
    PGVECTOR_USER: *PGVECTOR_USER
    PGVECTOR_PASSWORD: *PGVECTOR_PASSWORD
    ELASTIC_AUTH_USER: *ELASTIC_AUTH_USER
    ELASTIC_AUTH_PASSWORD: *ELASTIC_AUTH_PASSWORD

admin-frontend:
  enabled: true
  fullnameOverride: "statgpt-admin-frontend"
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "0.25Gi"
  env:
    DIAL_API_URL: *DIAL_URL
    API_URL: "http://statgpt-admin-backend/admin"
    AUTH_URL: "http://statgpt-admin-frontend"
    AUTH_TRUST_HOST: "true"
  secrets:
    DIAL_API_KEY: *DIAL_API_KEY
    AUTH_SECRET: "AUTH_SECRET"

pgvector:
  enabled: true
  fullnameOverride: "statgpt-pgvector"
  primary:
    resources:
      limits:
        cpu: "1000m"
        memory: "1Gi"
      requests:
        cpu: "250m"
        memory: "0.5Gi"
  auth:
    database: *PGVECTOR_DATABASE
    postgresPassword: "postgresPassword"
    username: *PGVECTOR_USER
    password: *PGVECTOR_PASSWORD

elasticsearch:
  enabled: true
  fullnameOverride: "statgpt-elasticsearch"
  master:
    heapSize: 512m
    resources:
      limits:
        cpu: "1000m"
        memory: "1Gi"
      requests:
        cpu: "250m"
        memory: "0.5Gi"
  security:
    enabled: true
    elasticPassword: *ELASTIC_AUTH_PASSWORD
    tls:
      restEncryption: false

portal-frontend:
  enabled: true
  fullnameOverride: "statgpt-portal-frontend"
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "0.25Gi"
  env:
    DIAL_API_URL: *DIAL_URL
    DIAL_API_VERSION: "2025-04-01-preview"
    DEFAULT_MODEL: "DEFAULT_MODEL"
    AUTH_URL: "http://statgpt-portal-frontend"
    AUTH_TRUST_HOST: "true"
    SDMX_API_URL: "SDMX_API_URL"
  secrets:
    AUTH_SECRET: "AUTH_SECRET"
    SDMX_AUTH_KEY: "SDMX_AUTH_KEY"

sdmx-proxy:
  enabled: true
  fullnameOverride: "statgpt-sdmx-proxy"
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "0.25Gi"
  env:
    SDMXPROXY_REGISTRY_CONFIG_SOURCE_CONFIGSERVER_URL: "http://statgpt-sdmx-proxy-config-server"

sdmx-proxy-config-server:
  enabled: true
  fullnameOverride: "statgpt-sdmx-proxy-config-server"
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "0.25Gi"
  env:
    DIAL_STORAGE_BASE_URL: *DIAL_URL
    CONFIG_SERVER_SOURCE_CONFIG_PATH: "CONFIG_SERVER_SOURCE_CONFIG_PATH"
  secrets:
    DIAL_STORAGE_API_KEY: *DIAL_API_KEY

mcp-app-frontend:
  enabled: true
  fullnameOverride: "statgpt-mcp-app-frontend"
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  env:
    VITE_BASE_URL: "http://statgpt-mcp-app-frontend"

generic-rag:
  enabled: true
  fullnameOverride: "statgpt-generic-rag"
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "0.5Gi"
  env:
    DIAL_URL: *DIAL_URL
    DB_HOST: *PGVECTOR_HOST
    DB_PORT: *PGVECTOR_PORT
    # The CI pgvector creates the "vector" extension only in its single auth.database, so
    # generic-rag has to share it here. Real deployments give generic-rag its own database
    DB_NAME: *PGVECTOR_DATABASE
    ELASTICSEARCH_URL: *ELASTIC_CONNECTION_STRING
    ELASTICSEARCH_INDEX_PREFIX: "statgpt-test-generic-rag"
  secrets:
    DIAL_API_KEY: *DIAL_API_KEY
    DB_USERNAME: *PGVECTOR_USER
    DB_PASSWORD: *PGVECTOR_PASSWORD
    ELASTICSEARCH_USERNAME: *ELASTIC_AUTH_USER
    ELASTICSEARCH_PASSWORD: *ELASTIC_AUTH_PASSWORD
